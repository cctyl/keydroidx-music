plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Read feedback config from local.properties (not in git)
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def feedbackUrl = localProperties.getProperty('FEEDBACK_URL', 'http://127.0.0.1')
def feedbackKey = localProperties.getProperty('FEEDBACK_SECRET_KEY', '')

android {
    namespace 'io.github.cctyl.keydroidx.music'
    compileSdk rootProject.ext.COMPILE_SDK

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "io.github.cctyl.keydroidx.music"
        minSdk rootProject.ext.MIN_SDK
        targetSdk rootProject.ext.TARGET_SDK
        versionCode 4
        versionName "1.2.0"

        multiDexEnabled true
        buildConfigField "String", "FEEDBACK_URL", "\"${feedbackUrl}\""
        buildConfigField "String", "FEEDBACK_SECRET_KEY", "\"${feedbackKey}\""
    }

    signingConfigs {
        release {
            storeFile file(project.hasProperty("RELEASE_STORE_FILE") ? RELEASE_STORE_FILE : "test.jks")
            storePassword project.hasProperty("RELEASE_STORE_PASSWORD") ? RELEASE_STORE_PASSWORD : ""
            keyAlias project.hasProperty("RELEASE_KEY_ALIAS") ? RELEASE_KEY_ALIAS : "key0"
            keyPassword project.hasProperty("RELEASE_KEY_PASSWORD") ? RELEASE_KEY_PASSWORD : ""
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // NewApi 必须开启：minSdk=19（Android 4.4）下，高于 minSdk 的 API 调用只会在旧设备上
        // 「运行时」抛 NoSuchMethodError / NoClassDefFoundError，编译器按 compileSdk 编译永远
        // 发现不了，Lint 的 NewApi 规则是唯一静态防线。
        // ⚠ 禁止 disable 'NewApi'，也禁止用 `-x lint` 跳过 Lint；确属误报时在调用点逐处用
        //   @RequiresApi / @TargetApi / @SuppressLint("NewApi") 豁免并写明理由。
        // 改完涉及 API 调用的代码后请显式执行（assembleDebug 不触发 Lint，assembleRelease 只跑
        // lintVital 的致命项，都拦不住 NewApi error）：gradlew.bat :app:lintDebug
        abortOnError true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.squareup.okhttp3') {
                details.useVersion '3.12.12'
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "KeydroidXMusic-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation 'io.github.cctyl.nokia:keydroidx-key-core:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Net
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.12.12'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20230227'

    // Media
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
